<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paraphrase any website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Start screen -->
  <section id="start-screen" class="screen screen--active">
    <main class="container">
      <h1 class="title">Paraphrase any website.<br>Free. Forever.</h1>
      <div class="model-select-wrapper">
        <span class="model-select-label">Language model:</span>
        <select id="model-select" class="model-select" aria-label="Select language model:">
          <option value="normal">Normal paraphrase</option>
          <option value="academic">Academic style</option>
          <option value="memorization">Key points + summary</option>
        </select>
      </div>
      <div class="input-wrapper">
        <input
          type="text"
          class="text-input"
          id="text-input"
          placeholder="copy text here"
          aria-label="Paste or type text to paraphrase"
        />
        <button type="button" class="send-btn" id="send-btn" aria-label="Send">
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
    </main>
    <footer class="version">(alpha) V0.0.01</footer>
  </section>

  <!-- Loading screen (thinking animation while AI runs) -->
  <section id="loading-screen" class="screen loading-screen">
    <div class="loading-screen-inner">
      <div class="thinking-dots" aria-hidden="true">
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
        <span class="thinking-dot"></span>
      </div>
      <p id="loading-status" class="loading-status">Preparing…</p>
      <p class="loading-hint">Rewriting runs in your browser—no external services.</p>
    </div>
  </section>

  <!-- Result screen (after arrow is pressed) -->
  <section id="result-screen" class="screen">
    <aside class="notes-panel">
      <h2 class="notes-header">NOTES:</h2>
      <div class="notes-content">
        <!-- Notes area - for future use -->
      </div>
      <!-- FEEDBACK BLOCK START - remove entire block for release -->
      <div id="notes-feedback" class="notes-feedback">
        <span class="notes-feedback-label">Notes helpful?</span>
        <div class="notes-feedback-btns">
          <button type="button" id="feedback-good" class="notes-feedback-btn">Good</button>
          <button type="button" id="feedback-bad" class="notes-feedback-btn notes-feedback-btn--bad">Not informative</button>
        </div>
      </div>
      <!-- FEEDBACK BLOCK END -->
    </aside>
    <div class="ai-output-area">
      <div class="ai-output-content">
        <!-- AI output will go here in the future -->
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
